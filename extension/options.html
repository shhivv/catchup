<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #141414;
      color: #e8e4df;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #5a5a5a;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: #8a8a8a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e4df;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: rgba(201, 168, 124, 0.5);
    }
    input::placeholder {
      color: #3a3a3a;
    }
    button {
      padding: 10px 20px;
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e8e4df;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      border-color: rgba(201, 168, 124, 0.3);
      background: #242424;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
    }
    .status.success { color: #7ec77e; }
    .status.error { color: #c77e7e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>catchup</h1>
    <p class="subtitle">extension settings</p>

    <label for="serverUrl">Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://your-server.com" />

    <label for="apiKey">API Key</label>
    <input type="text" id="apiKey" placeholder="your-api-key" />

    <button id="saveBtn">Save</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
